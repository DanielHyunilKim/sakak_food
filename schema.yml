openapi: 3.0.3
info:
  title: Food Nutrition API
  version: 1.0.0
  description: Search and manage Korean food nutrition data.
paths:
  /api/foods/:
    get:
      operationId: foods_list
      description: 식품명, 조사년도, 지역/제조사, 식품코드로 검색합니다. 여러 조건은 AND로 결합되며 결과는 페이지네이션됩니다.
      summary: 식품 목록 검색
      parameters:
      - in: query
        name: food_code
        schema:
          type: string
        description: 식품코드(food_cd). 대소문자를 구분하지 않습니다.
        examples:
          FoodCode:
            value: D000008
            summary: Food code
      - in: query
        name: food_name
        schema:
          type: string
        description: 식품명. match 방식에 따라 부분 또는 정확 일치합니다.
        examples:
          FoodName:
            value: 닭갈비
            summary: Food name
      - in: query
        name: maker_name
        schema:
          type: string
        description: 지역/제조사. match 방식에 따라 부분 또는 정확 일치합니다.
        examples:
          MakerOrRegion:
            value: 춘천
            summary: Maker or region
      - in: query
        name: match
        schema:
          type: string
          enum:
          - exact
          - partial
          default: partial
        description: 텍스트 검색 방식. 기본값은 partial입니다.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: research_year
        schema:
          type: integer
        description: 조사년도. 항상 정확 일치합니다.
        examples:
          ResearchYear:
            value: 2019
            summary: Research year
      tags:
      - foods
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFoodList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                ValidationError:
                  value:
                    error:
                      status: 400
                      code: validation_error
                      details:
                        food_cd:
                        - food with this food cd already exists.
                  summary: Validation error
          description: 요청값 또는 검색 조건이 올바르지 않습니다.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                InternalServerError:
                  value:
                    error:
                      status: 500
                      code: internal_server_error
                      details:
                        detail:
                        - An unexpected error occurred.
                  summary: Internal server error
          description: 예상하지 못한 서버 오류입니다.
    post:
      operationId: foods_create
      description: CRUD API for food items with case-insensitive filtering.
      summary: 식품 생성
      tags:
      - foods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Food'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Food'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Food'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                ValidationError:
                  value:
                    error:
                      status: 400
                      code: validation_error
                      details:
                        food_cd:
                        - food with this food cd already exists.
                  summary: Validation error
          description: 요청값 또는 검색 조건이 올바르지 않습니다.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                InternalServerError:
                  value:
                    error:
                      status: 500
                      code: internal_server_error
                      details:
                        detail:
                        - An unexpected error occurred.
                  summary: Internal server error
          description: 예상하지 못한 서버 오류입니다.
  /api/foods/{id}/:
    get:
      operationId: foods_retrieve
      description: CRUD API for food items with case-insensitive filtering.
      summary: 식품 상세 조회
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this food.
        required: true
      tags:
      - foods
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                FoodNotFound:
                  value:
                    error:
                      status: 404
                      code: not_found
                      details:
                        detail:
                        - No Food matches the given query.
                  summary: Food not found
          description: 요청한 식품이 존재하지 않습니다.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                InternalServerError:
                  value:
                    error:
                      status: 500
                      code: internal_server_error
                      details:
                        detail:
                        - An unexpected error occurred.
                  summary: Internal server error
          description: 예상하지 못한 서버 오류입니다.
    put:
      operationId: foods_update
      description: CRUD API for food items with case-insensitive filtering.
      summary: 식품 전체 수정
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this food.
        required: true
      tags:
      - foods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Food'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Food'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Food'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                ValidationError:
                  value:
                    error:
                      status: 400
                      code: validation_error
                      details:
                        food_cd:
                        - food with this food cd already exists.
                  summary: Validation error
          description: 요청값 또는 검색 조건이 올바르지 않습니다.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                FoodNotFound:
                  value:
                    error:
                      status: 404
                      code: not_found
                      details:
                        detail:
                        - No Food matches the given query.
                  summary: Food not found
          description: 요청한 식품이 존재하지 않습니다.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                InternalServerError:
                  value:
                    error:
                      status: 500
                      code: internal_server_error
                      details:
                        detail:
                        - An unexpected error occurred.
                  summary: Internal server error
          description: 예상하지 못한 서버 오류입니다.
    patch:
      operationId: foods_partial_update
      description: CRUD API for food items with case-insensitive filtering.
      summary: 식품 일부 수정
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this food.
        required: true
      tags:
      - foods
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFood'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFood'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFood'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Food'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                ValidationError:
                  value:
                    error:
                      status: 400
                      code: validation_error
                      details:
                        food_cd:
                        - food with this food cd already exists.
                  summary: Validation error
          description: 요청값 또는 검색 조건이 올바르지 않습니다.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                FoodNotFound:
                  value:
                    error:
                      status: 404
                      code: not_found
                      details:
                        detail:
                        - No Food matches the given query.
                  summary: Food not found
          description: 요청한 식품이 존재하지 않습니다.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                InternalServerError:
                  value:
                    error:
                      status: 500
                      code: internal_server_error
                      details:
                        detail:
                        - An unexpected error occurred.
                  summary: Internal server error
          description: 예상하지 못한 서버 오류입니다.
    delete:
      operationId: foods_destroy
      description: CRUD API for food items with case-insensitive filtering.
      summary: 식품 삭제
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: A unique value identifying this food.
        required: true
      tags:
      - foods
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                FoodNotFound:
                  value:
                    error:
                      status: 404
                      code: not_found
                      details:
                        detail:
                        - No Food matches the given query.
                  summary: Food not found
          description: 요청한 식품이 존재하지 않습니다.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
              examples:
                InternalServerError:
                  value:
                    error:
                      status: 500
                      code: internal_server_error
                      details:
                        detail:
                        - An unexpected error occurred.
                  summary: Internal server error
          description: 예상하지 못한 서버 오류입니다.
components:
  schemas:
    ApiError:
      type: object
      properties:
        status:
          type: integer
        code:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - code
      - details
      - status
    ApiErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      required:
      - error
    Food:
      type: object
      properties:
        id:
          type: string
        food_cd:
          type: string
        group_name:
          type: string
          readOnly: true
        group_name_major:
          type: string
        group_name_minor:
          type: string
        food_name:
          type: string
        research_year:
          type: integer
          maximum: 2147483647
          minimum: 0
        maker_name:
          type: string
        ref_name:
          type: string
        serving_size:
          type: string
        serving_size_unit:
          type: string
        calorie:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        carbohydrate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        protein:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        fat:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        sugars:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        sodium:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        cholesterol:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        saturated_fatty_acids:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        trans_fat:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
      required:
      - calorie
      - carbohydrate
      - cholesterol
      - fat
      - food_cd
      - food_name
      - group_name
      - group_name_major
      - group_name_minor
      - id
      - maker_name
      - protein
      - ref_name
      - research_year
      - saturated_fatty_acids
      - serving_size
      - serving_size_unit
      - sodium
      - sugars
      - trans_fat
    PaginatedFoodList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Food'
    PatchedFood:
      type: object
      properties:
        id:
          type: string
        food_cd:
          type: string
        group_name:
          type: string
          readOnly: true
        group_name_major:
          type: string
        group_name_minor:
          type: string
        food_name:
          type: string
        research_year:
          type: integer
          maximum: 2147483647
          minimum: 0
        maker_name:
          type: string
        ref_name:
          type: string
        serving_size:
          type: string
        serving_size_unit:
          type: string
        calorie:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        carbohydrate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        protein:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        fat:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        sugars:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        sodium:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        cholesterol:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        saturated_fatty_acids:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        trans_fat:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
